name: Add Personal and Family Goal submenus
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  modify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Add Personal and Family Goal submenus')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Portfolio Goals navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManager.tsx')
          s = p.read_text()
          state_old = "  const [forecastVisible, setForecastVisible] = useState(false);\n  const [goalsVisible, setGoalsVisible] = useState(false);"
          state_new = "  const [forecastVisible, setForecastVisible] = useState(false);\n  const [goalsVisible, setGoalsVisible] = useState(false);\n  const [goalView, setGoalView] = useState<'personal' | 'family'>('personal');"
          if state_old not in s:
              raise SystemExit('state marker not found')
          s = s.replace(state_old, state_new, 1)
          import_old = "import { GoalPlanner } from './GoalPlanner';"
          import_new = "import { GoalPlanner } from './GoalPlanner';\nimport { GoalPlanningCards } from './GoalPlanningCards';"
          if import_old in s and 'GoalPlanningCards' not in s:
              s = s.replace(import_old, import_new, 1)
          old = "    {goalsVisible && <>\n      <GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />\n      <GoalIntelligence goals={goals.map(goal => ({ ...goal, scope: 'personal' as const }))} />\n      <FamilyGoalContribution />\n    </>}"
          new = """    {goalsVisible && <>\n      <section className=\"mt-5 rounded-2xl border border-slate-200 bg-white p-2 shadow-sm\">\n        <div className=\"flex w-full gap-1 rounded-xl bg-slate-50 p-1\">\n          <button type=\"button\" onClick={() => setGoalView('personal')} className={`flex-1 rounded-lg px-3 py-2.5 text-xs sm:text-sm font-bold transition ${goalView === 'personal' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:bg-white'}`}>Personal Goals</button>\n          <button type=\"button\" onClick={() => setGoalView('family')} className={`flex-1 rounded-lg px-3 py-2.5 text-xs sm:text-sm font-bold transition ${goalView === 'family' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:bg-white'}`}>Family Goals</button>\n        </div>\n      </section>\n      {goalView === 'personal' && <>\n        <GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />\n        <GoalPlanningCards goals={goals} />\n        <GoalIntelligence goals={goals.map(goal => ({ ...goal, scope: 'personal' as const }))} />\n      </>}\n      {goalView === 'family' && <>\n        <section className=\"mt-5 rounded-2xl border border-indigo-100 bg-gradient-to-br from-white via-indigo-50/50 to-cyan-50/50 p-4 sm:p-5 shadow-sm\">\n          <p className=\"text-xs font-semibold uppercase tracking-wider text-indigo-600\">Family Goals</p>\n          <h3 className=\"mt-1 text-lg font-bold text-slate-900\">Shared household goals</h3>\n          <p className=\"mt-1 text-xs sm:text-sm text-slate-500\">View and contribute to goals shared with your family. Goal creation and detailed household planning remain available in the Family section.</p>\n        </section>\n        <FamilyGoalContribution />\n      </>}\n    </>}"""
          if old not in s:
              raise SystemExit('goals block marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManager.tsx
          git commit -m "Add Personal and Family Goal submenus"
          git rm .github/workflows/add-goal-tabs.yml
          git commit -m "Remove temporary goal submenu workflow"
          git push
