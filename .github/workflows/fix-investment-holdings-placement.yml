name: Fix Investment Holdings Placement
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-investment-holdings-placement.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move holdings into portfolio tab only
        run: |
          python - <<'PY'
          from pathlib import Path
          pm = Path('src/components/PortfolioManager.tsx')
          s = pm.read_text()
          s = s.replace("import { InvestmentHoldingsAuto } from './InvestmentHoldingsAuto';\n", "")
          s = s.replace("    {portfolioVisible && <InvestmentHoldingsAuto config={config} onSave={onSave} />}\n", "")
          pm.write_text(s)

          core = Path('src/components/PortfolioManagerCore.tsx')
          s = core.read_text()
          if "import { InvestmentHoldingsAuto } from './InvestmentHoldingsAuto';" not in s:
              marker = "import { formatCurrency } from '../utils/formatters';\n"
              s = s.replace(marker, marker + "import { InvestmentHoldingsAuto } from './InvestmentHoldingsAuto';\n", 1)
          target = "</div>{fields.length === 0 ? <Empty"
          if target not in s:
              raise SystemExit('Could not locate portfolio investments block')
          tab_marker = "{tab === 'networth'"
          idx = s.find(tab_marker)
          if idx < 0:
              raise SystemExit('Could not locate net worth tab')
          if "<InvestmentHoldingsAuto config={config} onSave={onSave} />" not in s:
              s = s[:idx] + "<InvestmentHoldingsAuto config={config} onSave={onSave} />" + s[idx:]
          core.write_text(s)
          PY
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManager.tsx src/components/PortfolioManagerCore.tsx
          git commit -m "Show investment holdings only in portfolio" || true
          git push
          git rm .github/workflows/fix-investment-holdings-placement.yml || true
          git commit -m "Remove temporary holdings workflow" || true
          git push