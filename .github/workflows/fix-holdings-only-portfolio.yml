name: Fix Holdings Only Portfolio
on:
  push:
    paths:
      - .github/workflows/fix-holdings-only-portfolio.yml
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch and build
        run: |
          python - <<'PY'
          from pathlib import Path
          pm = Path('src/components/PortfolioManager.tsx')
          s = pm.read_text()
          old = "const activePortfolio = Array.from(document.querySelectorAll('button')).find(button => button.textContent?.trim() === 'Portfolio' && button.className.includes('bg-slate-900'));"
          new = "const activePortfolio = Array.from(document.querySelectorAll('button')).filter(button => button.textContent?.trim() === 'Portfolio' && button.className.includes('bg-slate-900')).pop();"
          if old not in s:
              raise SystemExit('portfolio tab detection not found')
          pm.write_text(s.replace(old, new, 1))
          PY
          npm install --no-audit --no-fund
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManager.tsx
          git commit -m "Restrict investment holdings to Portfolio tab"
          git push