name: Add income list

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch income list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/FinBookApp.tsx')
          s = p.read_text()
          marker = "const totalIncome=cashFlowIncomes.reduce((sum,i)=>sum+i.amount,0);"
          insert = '''\n  const sortedIncome = useMemo(() => [...cashFlowIncomes].sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt), [cashFlowIncomes]);\n'''
          if marker not in s:
              raise SystemExit('income calculation marker not found')
          if 'const sortedIncome = useMemo' not in s:
              s = s.replace(marker, marker + insert, 1)

          old = "<MetricCards expenses={cashFlowExpenses} incomes={cashFlowIncomes} budget={budget} alerts={periodAlerts}/>"
          if old not in s:
              raise SystemExit('MetricCards render marker not found')
          block = '''<MetricCards expenses={cashFlowExpenses} incomes={cashFlowIncomes} budget={budget} alerts={periodAlerts}/>\n          <section className="mt-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">\n            <div className="flex items-center justify-between gap-3">\n              <div>\n                <h3 className="text-lg font-bold text-slate-900">Income Received</h3>\n                <p className="mt-0.5 text-xs text-slate-500 sm:text-sm">Income recorded in this financial cycle</p>\n              </div>\n              <div className="text-right">\n                <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Total</p>\n                <p className="text-base font-bold text-emerald-700 sm:text-lg">₹{totalIncome.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>\n              </div>\n            </div>\n            {sortedIncome.length === 0 ? (\n              <div className="mt-4 rounded-xl border border-dashed border-slate-200 bg-slate-50 p-5 text-center">\n                <p className="text-sm font-semibold text-slate-600">No income recorded in this cycle</p>\n                <p className="mt-1 text-xs text-slate-400">Use “Record income” above to add salary or other income.</p>\n              </div>\n            ) : (\n              <div className="mt-4 space-y-2">\n                {sortedIncome.map(income => (\n                  <div key={income.id} className="flex items-center justify-between gap-3 rounded-xl border border-slate-100 bg-slate-50/70 px-3 py-3">\n                    <div className="min-w-0">\n                      <p className="truncate text-sm font-bold text-slate-800">{income.title}</p>\n                      <p className="mt-0.5 truncate text-xs text-slate-500">{formatDate(income.date)} · {income.source || 'Income'}</p>\n                    </div>\n                    <div className="shrink-0 text-right">\n                      <p className="text-sm font-bold text-emerald-700">₹{income.amount.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>\n                    </div>\n                  </div>\n                ))}\n              </div>\n            )}\n          </section>'''
          s = s.replace(old, block, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FinBookApp.tsx
          git commit -m "Show recorded income in overview" || exit 0
          git push
