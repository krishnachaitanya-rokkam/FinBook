name: Separate Core Goals panel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  modify:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'Remove temporary core goals workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable duplicate Core Goals panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          marker = "{tab === 'goals' &&"
          if marker not in s:
              raise SystemExit('Goals panel marker not found')
          s = s.replace(marker, "{false && tab === 'goals' &&", 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git commit -m "Separate Portfolio personal and family goals"
          git rm .github/workflows/hide-core-goals.yml
          git commit -m "Remove temporary core goals workflow"
          git push
