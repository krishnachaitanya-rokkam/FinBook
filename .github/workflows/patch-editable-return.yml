name: Patch editable forecast return

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply editable forecast return') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch forecast return input
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          s = s.replace('const [forecastPeriod, setForecastPeriod] = useState<1 | 3 | 5>(5); const [forecastRate, setForecastRate] = useState<8 | 10 | 12>(10); const [monthlyContribution, setMonthlyContribution] = useState<number | null>(null);', 'const [forecastPeriod, setForecastPeriod] = useState<1 | 3 | 5>(5); const [forecastRate, setForecastRate] = useState<number>(10); const [monthlyContribution, setMonthlyContribution] = useState<number | null>(null);')
          s = s.replace('<div className="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-3 py-3"><span className="text-sm text-slate-600">Investment return</span><span className="text-sm font-bold whitespace-nowrap">{forecastRate}% / year</span></div>', '<label className="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-3 py-3"><span className="text-sm text-slate-600">Investment return</span><div className="flex items-center gap-1.5"><input aria-label="Investment return" type="number" min="0" max="30" step="0.5" value={forecastRate} onChange={e => setForecastRate(Math.min(30, Math.max(0, Number(e.target.value) || 0)))} className="w-24 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-right text-sm font-bold outline-none focus:border-indigo-500"/><span className="text-sm font-bold text-slate-500">% / year</span></div></label>')
          s = s.replace('<p className="text-xs text-indigo-600">Expected — 10%</p>', '<p className="text-xs text-indigo-600">Expected — {forecastRate}%</p>')
          if s.count('useState<number>(10)') != 1 or 'aria-label="Investment return"' not in s or 'Expected — {forecastRate}%' not in s:
              raise SystemExit('Patch verification failed')
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply editable forecast return"
          git push
