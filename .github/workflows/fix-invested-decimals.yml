name: Fix Invested Amount Decimals

on:
  push:
    paths:
      - '.github/workflows/fix-invested-decimals.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix decimal inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/InvestmentHoldingsAuto.tsx')
          s = p.read_text()
          s = s.replace('type="number" min="1" value={draft.investedAmount}', 'type="number" min="0.01" step="0.01" inputMode="decimal" value={draft.investedAmount}')
          s = s.replace('type="number" min="0" value={draft.investedAmount}', 'type="number" min="0" step="0.01" inputMode="decimal" value={draft.investedAmount}')
          p.write_text(s)
          PY
          grep -o 'type="number" min="[^"]*" step="0.01" inputMode="decimal" value={draft.investedAmount}' src/components/InvestmentHoldingsAuto.tsx
      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InvestmentHoldingsAuto.tsx .github/workflows/fix-invested-decimals.yml
          git commit -m "Allow decimal invested amounts in holdings" -- src/components/InvestmentHoldingsAuto.tsx .github/workflows/fix-invested-decimals.yml
          git rm .github/workflows/fix-invested-decimals.yml
          git commit -m "Remove temporary decimal fix workflow"
          git push
