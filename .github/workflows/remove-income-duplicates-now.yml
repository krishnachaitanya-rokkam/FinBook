name: Remove duplicate income sections now
on:
  push:
    paths:
      - '.github/workflows/remove-income-duplicates-now.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/FinBookApp.tsx'); s=p.read_text()
          pattern=r'          <section className="mt-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">\n            <div className="flex items-center justify-between gap-3"><div><h3 className="text-lg font-bold text-slate-900">Income Received</h3>.*?          </section>'
          m=list(re.finditer(pattern,s,re.S)); print('found',len(m))
          if len(m)>1: p.write_text(s[:m[0].start()]+m[-1].group(0)+s[m[-1].end():])
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FinBookApp.tsx
          git diff --cached --quiet || git commit -m 'Remove duplicate income sections'
          git push
