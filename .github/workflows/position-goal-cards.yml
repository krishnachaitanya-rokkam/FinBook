name: Position goal cards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Position goal cards') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move goal cards below Create a goal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManager.tsx')
          s = p.read_text()
          if "import { GoalPlanningCards } from './GoalPlanningCards';" not in s:
              s = s.replace("import { GoalPlanner } from './GoalPlanner';\n", "import { GoalPlanner } from './GoalPlanner';\nimport { GoalPlanningCards } from './GoalPlanningCards';\n")
          old = "        </section>\n        <GoalPlanner goals={goals} onReturnChange={syncGoalReturn} onEditGoal={openEditGoal} onDeleteGoal={removeGoal} />"
          new = "        </section>\n        <GoalPlanningCards goals={goals} onEditGoal={openEditGoal} onDeleteGoal={removeGoal} />\n        <GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />"
          if old not in s:
              raise SystemExit('Expected Personal Goals layout not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManager.tsx
          git commit -m "Position goal cards below Create a goal"
          git push
          git rm .github/workflows/position-goal-cards.yml
          git commit -m "Remove temporary goal card positioning workflow"
          git push
