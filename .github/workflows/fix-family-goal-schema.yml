name: Fix family goal schema

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch family sync schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          pattern = r"  const syncFamilyGoal = async \(goal: FinancialGoal, previousFamilyId\?: string\) => \{.*?\n  \};\n  useEffect"
          replacement = '''  const syncFamilyGoal = async (goal: FinancialGoal, previousFamilyId?: string) => {
    const oldFamilyId = previousFamilyId || '';
    if (oldFamilyId && (goal.scope !== 'family' || goal.familyId !== oldFamilyId)) {
      await deleteDoc(doc(firestore, 'families', oldFamilyId, 'goals', goal.id));
    }
    if (goal.scope === 'family' && goal.familyId) {
      // Match the shared FamilyGoals schema so Firestore rules treat mirrored goals
      // the same way as goals created directly from the Family dashboard.
      await setDoc(doc(firestore, 'families', goal.familyId, 'goals', goal.id), {
        name: goal.name,
        targetAmount: goal.targetAmount,
        targetDate: goal.targetDate,
        monthlyContribution: goal.monthlyContribution,
        createdBy: firebaseAuth.currentUser?.uid || '',
        createdAt: Date.now(),
        currentAmount: goal.currentAmount,
        contributions: {},
        contributorNames: {},
        updatedAt: Date.now()
      }, { merge: true });
    }
  };
  useEffect'''
          updated, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'syncFamilyGoal block not found: {count}')
          p.write_text(updated)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git diff --cached --quiet || git commit -m "fix: align family goal sync schema"
          git push
