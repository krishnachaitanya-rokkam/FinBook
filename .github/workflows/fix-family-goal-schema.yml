name: Fix family goal schema

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch family sync schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          old = '''  const syncFamilyGoal = async (goal: FinancialGoal, previousFamilyId?: string) => {
            const oldFamilyId = previousFamilyId || '';
            if (oldFamilyId && (goal.scope !== 'family' || goal.familyId !== oldFamilyId)) {
              await deleteDoc(doc(firestore, 'families', oldFamilyId, 'goals', goal.id));
            }
            if (goal.scope === 'family' && goal.familyId) {
              await setDoc(doc(firestore, 'families', goal.familyId, 'goals', goal.id), {
                name: goal.name, targetAmount: goal.targetAmount, currentAmount: goal.currentAmount, targetDate: goal.targetDate, monthlyContribution: goal.monthlyContribution,
                type: goal.type, scope: 'family', familyId: goal.familyId, familyName: goal.familyName || '', createdBy: firebaseAuth.currentUser?.uid || '', createdAt: Date.now(), updatedAt: Date.now()
              }, { merge: true });
            }
          };'''
          new = '''  const syncFamilyGoal = async (goal: FinancialGoal, previousFamilyId?: string) => {
            const oldFamilyId = previousFamilyId || '';
            if (oldFamilyId && (goal.scope !== 'family' || goal.familyId !== oldFamilyId)) {
              await deleteDoc(doc(firestore, 'families', oldFamilyId, 'goals', goal.id));
            }
            if (goal.scope === 'family' && goal.familyId) {
              // Keep the shared document schema identical to FamilyGoals.tsx so Firestore
              // rules can treat a mirrored goal exactly like a goal created in Family.
              await setDoc(doc(firestore, 'families', goal.familyId, 'goals', goal.id), {
                name: goal.name,
                targetAmount: goal.targetAmount,
                targetDate: goal.targetDate,
                monthlyContribution: goal.monthlyContribution,
                createdBy: firebaseAuth.currentUser?.uid || '',
                createdAt: Date.now(),
                currentAmount: goal.currentAmount,
                contributions: {},
                contributorNames: {},
                updatedAt: Date.now()
              }, { merge: true });
            }
          };'''
          if old not in s:
              raise SystemExit('syncFamilyGoal block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git diff --cached --quiet || git commit -m "fix: align family goal sync schema"
          git push
