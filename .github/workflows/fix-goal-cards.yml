name: Fix goal cards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch goal UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          planner = Path('src/components/GoalPlanner.tsx')
          s = planner.read_text()
          s = s.replace("import { GoalPlanningCards } from './GoalPlanningCards';\n", "")
          s = s.replace("interface GoalPlannerProps { goals: FinancialGoal[]; onReturnChange?: (annualReturn: number) => Promise<void> | void; }", "interface GoalPlannerProps { goals: FinancialGoal[]; onReturnChange?: (annualReturn: number) => Promise<void> | void; onEditGoal?: (goal: FinancialGoal) => void; onDeleteGoal?: (id: string) => void; }")
          s = s.replace("export const GoalPlanner: React.FC<GoalPlannerProps> = ({ goals, onReturnChange }) => {", "export const GoalPlanner: React.FC<GoalPlannerProps> = ({ goals, onReturnChange, onEditGoal, onDeleteGoal }) => {")
          s = s.replace("<div className=\"border-t border-indigo-100 pt-4\"><GoalPlanningCards goals={goals} /></div>", "")
          planner.write_text(s)

          cards = Path('src/components/GoalPlanningCards.tsx')
          s = cards.read_text()
          s = s.replace("import { AlertTriangle, CheckCircle2, Target } from 'lucide-react';", "import { AlertTriangle, CheckCircle2, Pencil, Target, Trash2 } from 'lucide-react';")
          s = s.replace("interface Props { goals: FinancialGoal[]; }", "interface Props { goals: FinancialGoal[]; onEditGoal?: (goal: FinancialGoal) => void; onDeleteGoal?: (id: string) => void; }")
          s = s.replace("export const GoalPlanningCards: React.FC<Props> = ({ goals }) => {", "export const GoalPlanningCards: React.FC<Props> = ({ goals, onEditGoal, onDeleteGoal }) => {")
          old = '<div className="flex items-start justify-between gap-3">\n        <div className="min-w-0">'
          new = '<div className="flex items-start justify-between gap-3">\n        <div className="min-w-0">'
          # Keep the existing header layout and add action buttons beside the status badge.
          s = s.replace('<span className={`inline-flex items-center gap-1 rounded-full px-2 py-1 text-[10px] font-bold ${p.onTrack ? \'bg-emerald-50 text-emerald-700\' : \'bg-amber-50 text-amber-700\'}`}>{p.onTrack ? <CheckCircle2 className="h-3.5 w-3.5" /> : <AlertTriangle className="h-3.5 w-3.5" />}{p.onTrack ? \'ON TRACK\' : \'NEEDS ATTENTION\'}</span>', '<div className="flex shrink-0 items-center gap-2"><span className={`inline-flex items-center gap-1 rounded-full px-2 py-1 text-[10px] font-bold ${p.onTrack ? \'bg-emerald-50 text-emerald-700\' : \'bg-amber-50 text-amber-700\'}`}>{p.onTrack ? <CheckCircle2 className="h-3.5 w-3.5" /> : <AlertTriangle className="h-3.5 w-3.5" />}{p.onTrack ? \'ON TRACK\' : \'NEEDS ATTENTION\'}</span>{onEditGoal && <button type="button" onClick={() => onEditGoal(p.goal)} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-indigo-600" aria-label={`Edit ${p.goal.name}`} title="Edit goal"><Pencil className="h-4 w-4" /></button>}{onDeleteGoal && <button type="button" onClick={() => onDeleteGoal(p.goal.id)} className="rounded-lg p-1.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600" aria-label={`Delete ${p.goal.name}`} title="Delete goal"><Trash2 className="h-4 w-4" /></button>}</div>')
          cards.write_text(s)

          pm = Path('src/components/PortfolioManager.tsx')
          s = pm.read_text()
          s = s.replace("import { Plus, ShieldCheck, X } from 'lucide-react';", "import { Plus, ShieldCheck, X } from 'lucide-react';")
          s = s.replace("import { GoalPlanningCards } from './GoalPlanningCards';\n", "")
          s = s.replace("import { PortfolioConfig } from '../services/portfolioService';", "import { FinancialGoal, PortfolioConfig } from '../services/portfolioService';")
          s = s.replace("const [createGoalOpen, setCreateGoalOpen] = useState(false);", "const [createGoalOpen, setCreateGoalOpen] = useState(false);\n  const [editingGoalId, setEditingGoalId] = useState<string | null>(null);")
          old = '''  const saveCreatedGoal = async (event: React.FormEvent) => {\n    event.preventDefault();\n    const name = createGoalDraft.name.trim();\n    const targetAmount = Number(createGoalDraft.targetAmount);\n    const currentAmount = Number(createGoalDraft.currentAmount || 0);\n    const monthlyContribution = Number(createGoalDraft.monthlyContribution || 0);\n    const expectedAnnualReturn = createGoalDraft.type === 'investment' ? Math.min(50, Math.max(0, Number(createGoalDraft.expectedAnnualReturn || 0))) : 0;\n    if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !createGoalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return;\n    const slug = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\n    const goal = { id: `goal-${slug || 'item'}-${Date.now()}`, name, targetAmount, currentAmount, targetDate: createGoalDraft.targetDate, monthlyContribution, type: createGoalDraft.type, scope: 'personal' as const, expectedAnnualReturn };\n    await onSave({ ...config, goals: [...goals, goal] });\n    setCreateGoalDraft({ name: '', targetAmount: '', currentAmount: '', targetDate: '', monthlyContribution: '', type: 'savings', expectedAnnualReturn: '8' });\n    setCreateGoalOpen(false);\n  };'''
          new = '''  const resetGoalEditor = () => {\n    setCreateGoalDraft({ name: '', targetAmount: '', currentAmount: '', targetDate: '', monthlyContribution: '', type: 'savings', expectedAnnualReturn: '8' });\n    setEditingGoalId(null);\n  };\n\n  const openCreateGoal = () => { resetGoalEditor(); setCreateGoalOpen(true); };\n\n  const openEditGoal = (goal: FinancialGoal) => {\n    setEditingGoalId(goal.id);\n    setCreateGoalDraft({ name: goal.name, targetAmount: String(goal.targetAmount), currentAmount: String(goal.currentAmount), targetDate: goal.targetDate, monthlyContribution: String(goal.monthlyContribution), type: goal.type || 'savings', expectedAnnualReturn: String(goal.expectedAnnualReturn ?? (goal.type === 'investment' ? 8 : 0)) });\n    setCreateGoalOpen(true);\n  };\n\n  const removeGoal = async (id: string) => {\n    const goal = goals.find(item => item.id === id);\n    if (!goal || !window.confirm(`Delete the ${goal.name} goal?`)) return;\n    await onSave({ ...config, goals: goals.filter(item => item.id !== id) });\n  };\n\n  const saveCreatedGoal = async (event: React.FormEvent) => {\n    event.preventDefault();\n    const name = createGoalDraft.name.trim();\n    const targetAmount = Number(createGoalDraft.targetAmount);\n    const currentAmount = Number(createGoalDraft.currentAmount || 0);\n    const monthlyContribution = Number(createGoalDraft.monthlyContribution || 0);\n    const expectedAnnualReturn = createGoalDraft.type === 'investment' ? Math.min(50, Math.max(0, Number(createGoalDraft.expectedAnnualReturn || 0))) : 0;\n    if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !createGoalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0 || !Number.isFinite(expectedAnnualReturn)) return;\n    const slug = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\n    const goal: FinancialGoal = { id: editingGoalId || `goal-${slug || 'item'}-${Date.now()}`, name, targetAmount, currentAmount, targetDate: createGoalDraft.targetDate, monthlyContribution, type: createGoalDraft.type, scope: 'personal', expectedAnnualReturn };\n    const nextGoals = editingGoalId ? goals.map(existing => existing.id === editingGoalId ? goal : existing) : [...goals, goal];\n    await onSave({ ...config, goals: nextGoals });\n    resetGoalEditor();\n    setCreateGoalOpen(false);\n  };'''
          if old not in s:
              raise SystemExit('PortfolioManager save block not found')
          s = s.replace(old, new)
          s = s.replace('onClick={() => setCreateGoalOpen(true)}', 'onClick={openCreateGoal}')
          s = s.replace('<GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />\n        <GoalPlanningCards goals={goals} />', '<GoalPlanner goals={goals} onReturnChange={syncGoalReturn} onEditGoal={openEditGoal} onDeleteGoal={removeGoal} />')
          s = s.replace('<h3 className="text-lg font-bold text-slate-900">Create personal goal</h3>', '<h3 className="text-lg font-bold text-slate-900">{editingGoalId ? \'Edit personal goal\' : \'Create personal goal\'}</h3>')
          s = s.replace('<button type="button" onClick={() => setCreateGoalOpen(false)} className="rounded-lg p-2 text-slate-400 hover:bg-slate-100" aria-label="Close">', '<button type="button" onClick={() => { setCreateGoalOpen(false); resetGoalEditor(); }} className="rounded-lg p-2 text-slate-400 hover:bg-slate-100" aria-label="Close">')
          s = s.replace('<button type="button" onClick={() => setCreateGoalOpen(false)} className="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600">Cancel</button><button type="submit" className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">Save goal</button>', '<button type="button" onClick={() => { setCreateGoalOpen(false); resetGoalEditor(); }} className="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600">Cancel</button><button type="submit" className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">{editingGoalId ? \'Save changes\' : \'Save goal\'}</button>')
          pm.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GoalPlanner.tsx src/components/GoalPlanningCards.tsx src/components/PortfolioManager.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Restore editable goal cards under Goal Planning"
          git push
      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-goal-cards.yml
          git commit -m "Remove temporary goal card fix workflow"
          git push
