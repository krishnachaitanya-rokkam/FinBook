name: Integrate Wealth Allocation

on:
  push:
    paths:
      - '.github/workflows/patch-wealth-allocation.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate wealth allocation into portfolio manager
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/PortfolioManager.tsx')
          text = path.read_text()

          replacements = [
              ("import { GoalIntelligence } from './GoalIntelligence';", "import { GoalIntelligence } from './GoalIntelligence';\nimport { WealthAllocation } from './WealthAllocation';"),
              ("const [goalsVisible, setGoalsVisible] = useState(false);", "const [goalsVisible, setGoalsVisible] = useState(false);\n  const [netWorthVisible, setNetWorthVisible] = useState(false);"),
              ("const activeForecast = Array.from(document.querySelectorAll('button')).find(button => button.textContent?.trim() === 'Forecast' && button.className.includes('bg-slate-900'));\n      setGoalsVisible(Boolean(activeButton));\n      setForecastVisible(Boolean(activeForecast));", "const activeForecast = Array.from(document.querySelectorAll('button')).find(button => button.textContent?.trim() === 'Forecast' && button.className.includes('bg-slate-900'));\n      const activeNetWorth = Array.from(document.querySelectorAll('button')).find(button => button.textContent?.trim() === 'Net Worth' && button.className.includes('bg-slate-900'));\n      setGoalsVisible(Boolean(activeButton));\n      setForecastVisible(Boolean(activeForecast));\n      setNetWorthVisible(Boolean(activeNetWorth));"),
              ("<PortfolioManagerCore config={config} onSave={onSave} />", "<PortfolioManagerCore config={config} onSave={onSave} />\n    {netWorthVisible && <WealthAllocation config={config} />}")
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Marker not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManager.tsx
          git rm .github/workflows/patch-wealth-allocation.yml
          git commit -m "Integrate wealth allocation into net worth"
          git push

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST repos/krishnachaitanya-rokkam/FinBook/actions/workflows/deploy.yml/dispatches -f ref=main
