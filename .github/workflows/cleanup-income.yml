name: Cleanup income duplicates
on:
  push:
    paths: ['.github/workflows/cleanup-income.yml']
permissions: {contents: write}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/FinBookApp.tsx'); s=p.read_text()
          marker='          <section className="mt-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">'
          positions=[]; i=0
          while True:
              i=s.find(marker,i)
              if i<0: break
              positions.append(i); i+=len(marker)
          income=[x for x in positions if 'Income Received' in s[x:x+1500]]
          print('income sections',len(income))
          if len(income)>1:
              out=s
              for pos in reversed(income[:-1]):
                  start=pos
                  nxt=out.find(marker,start+len(marker))
                  if nxt>=0: out=out[:start]+out[nxt:]
              p.write_text(out)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add src/FinBookApp.tsx
          git diff --cached --quiet || (git commit -m 'Remove duplicate income sections' && git push)
