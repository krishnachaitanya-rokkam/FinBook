name: Sync tagged family goals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, 'Add family goal sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add family goal sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          s = s.replace("import { collection, doc, onSnapshot } from 'firebase/firestore';", "import { collection, deleteDoc, doc, onSnapshot, setDoc } from 'firebase/firestore';")
          s = s.replace("const fields = config.fields || []; const netWorthItems = config.netWorthItems || []; const goals = config.goals || [];", "const fields = config.fields || []; const netWorthItems = config.netWorthItems || []; const goals = config.goals || [];\n  const syncFamilyGoal = async (goal: FinancialGoal, previousFamilyId?: string) => {\n    const oldFamilyId = previousFamilyId || '';\n    if (oldFamilyId && (goal.scope !== 'family' || goal.familyId !== oldFamilyId)) {\n      await deleteDoc(doc(firestore, 'families', oldFamilyId, 'goals', goal.id));\n    }\n    if (goal.scope === 'family' && goal.familyId) {\n      await setDoc(doc(firestore, 'families', goal.familyId, 'goals', goal.id), {\n        name: goal.name, targetAmount: goal.targetAmount, currentAmount: goal.currentAmount, targetDate: goal.targetDate, monthlyContribution: goal.monthlyContribution,\n        type: goal.type, scope: 'family', familyId: goal.familyId, familyName: goal.familyName || '', createdBy: firebaseAuth.currentUser?.uid || '', createdAt: Date.now(), updatedAt: Date.now()\n      }, { merge: true });\n    }\n  };")
          old = "const saveGoal = async (event: React.FormEvent) => { event.preventDefault(); const name = goalDraft.name.trim(); const targetAmount = Number(goalDraft.targetAmount); const currentAmount = Number(goalDraft.currentAmount || 0); const monthlyContribution = Number(goalDraft.monthlyContribution || 0); if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !goalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return; const selectedFamily = availableFamilies.find(f => f.id === goalDraft.familyId); const goal: FinancialGoal = { id: editingGoalId || makeId('goal', name), name, targetAmount, currentAmount, targetDate: goalDraft.targetDate, monthlyContribution, type: goalDraft.type, scope: goalDraft.scope, familyId: goalDraft.scope === 'family' ? goalDraft.familyId || undefined : undefined, familyName: goalDraft.scope === 'family' ? selectedFamily?.name || goalDraft.familyName || undefined : undefined }; const nextGoals = editingGoalId ? goals.map(existing => existing.id === editingGoalId ? goal : existing) : [...goals, goal]; await saveConfig({ ...config, goals: nextGoals }); closeGoalEditor(); };"
          new = "const saveGoal = async (event: React.FormEvent) => { event.preventDefault(); const name = goalDraft.name.trim(); const targetAmount = Number(goalDraft.targetAmount); const currentAmount = Number(goalDraft.currentAmount || 0); const monthlyContribution = Number(goalDraft.monthlyContribution || 0); if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !goalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return; const selectedFamily = availableFamilies.find(f => f.id === goalDraft.familyId); const previous = editingGoalId ? goals.find(existing => existing.id === editingGoalId) : undefined; const goal: FinancialGoal = { id: editingGoalId || makeId('goal', name), name, targetAmount, currentAmount, targetDate: goalDraft.targetDate, monthlyContribution, type: goalDraft.type, scope: goalDraft.scope, familyId: goalDraft.scope === 'family' ? goalDraft.familyId || undefined : undefined, familyName: goalDraft.scope === 'family' ? selectedFamily?.name || goalDraft.familyName || undefined : undefined }; const nextGoals = editingGoalId ? goals.map(existing => existing.id === editingGoalId ? goal : existing) : [...goals, goal]; await saveConfig({ ...config, goals: nextGoals }); await syncFamilyGoal(goal, previous?.familyId); closeGoalEditor(); };"
          s = s.replace(old, new)
          old = "const removeGoal = async (id: string) => { const goal = goals.find(item => item.id === id); if (!goal || !window.confirm(`Delete the ${goal.name} goal?`)) return; await saveConfig({ ...config, goals: goals.filter(item => item.id !== id) }); };"
          new = "const removeGoal = async (id: string) => { const goal = goals.find(item => item.id === id); if (!goal || !window.confirm(`Delete the ${goal.name} goal?`)) return; await saveConfig({ ...config, goals: goals.filter(item => item.id !== id) }); if (goal.scope === 'family' && goal.familyId) await deleteDoc(doc(firestore, 'families', goal.familyId, 'goals', goal.id)); };"
          s = s.replace(old, new)
          old = "<p className=\"text-xs text-slate-400 mt-1\">Target {goal.targetDate ? new Date(`${goal.targetDate}T00:00:00`).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'}</p>"
          new = "<div className=\"flex flex-wrap gap-1.5 mt-1\"><span className=\"rounded-full bg-indigo-50 px-2 py-0.5 text-[10px] font-semibold text-indigo-600\">{goal.type === 'investment' ? 'Investment goal' : 'Savings goal'}</span><span className=\"rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-600\">{goal.scope === 'family' ? `Family${goal.familyName ? ` · ${goal.familyName}` : ''}` : 'Personal'}</span></div><p className=\"text-xs text-slate-400 mt-1\">Target {goal.targetDate ? new Date(`${goal.targetDate}T00:00:00`).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'}</p>"
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Sync family-tagged goals to family dashboard"
          git push
