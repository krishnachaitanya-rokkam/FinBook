name: Add Create Goal to Personal Goals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  modify:
    if: "!contains(github.event.head_commit.message, 'Remove temporary create goal workflow')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Create Goal UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManager.tsx')
          s = p.read_text()
          s = s.replace("import { ShieldCheck } from 'lucide-react';", "import { Plus, ShieldCheck, X } from 'lucide-react';", 1)
          s = s.replace("const [goalView, setGoalView] = useState<'personal' | 'family'>('personal');", "const [goalView, setGoalView] = useState<'personal' | 'family'>('personal');\n  const [createGoalOpen, setCreateGoalOpen] = useState(false);\n  const [createGoalDraft, setCreateGoalDraft] = useState({ name: '', targetAmount: '', currentAmount: '', targetDate: '', monthlyContribution: '', type: 'savings' as 'savings' | 'investment', expectedAnnualReturn: '8' });", 1)
          marker = "  const syncGoalReturn = async (annualReturn: number) => {"
          handler = "  const saveCreatedGoal = async (event: React.FormEvent) => {\n    event.preventDefault();\n    const name = createGoalDraft.name.trim();\n    const targetAmount = Number(createGoalDraft.targetAmount);\n    const currentAmount = Number(createGoalDraft.currentAmount || 0);\n    const monthlyContribution = Number(createGoalDraft.monthlyContribution || 0);\n    const expectedAnnualReturn = createGoalDraft.type === 'investment' ? Math.min(50, Math.max(0, Number(createGoalDraft.expectedAnnualReturn || 0))) : 0;\n    if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !createGoalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return;\n    const slug = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\n    const goal = { id: `goal-${slug || 'item'}-${Date.now()}`, name, targetAmount, currentAmount, targetDate: createGoalDraft.targetDate, monthlyContribution, type: createGoalDraft.type, scope: 'personal' as const, expectedAnnualReturn };\n    await onSave({ ...config, goals: [...goals, goal] });\n    setCreateGoalDraft({ name: '', targetAmount: '', currentAmount: '', targetDate: '', monthlyContribution: '', type: 'savings', expectedAnnualReturn: '8' });\n    setCreateGoalOpen(false);\n  };\n\n"
          if marker not in s: raise SystemExit('syncGoalReturn marker not found')
          s = s.replace(marker, handler + marker, 1)
          personal = "      {goalView === 'personal' && <>\n        <GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />"
          replacement = "      {goalView === 'personal' && <>\n        <section className=\"mt-5 rounded-2xl border border-indigo-100 bg-gradient-to-r from-indigo-50 via-white to-cyan-50 p-4 sm:p-5 shadow-sm\">\n          <div className=\"flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3\">\n            <div><p className=\"text-xs font-semibold uppercase tracking-wider text-indigo-600\">Personal Goals</p><h3 className=\"mt-1 text-lg font-bold text-slate-900\">Create a goal</h3><p className=\"mt-1 text-xs sm:text-sm text-slate-500\">Add a new personal savings or investment goal and include it in your planning.</p></div>\n            <button type=\"button\" onClick={() => setCreateGoalOpen(true)} className=\"inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-xs font-semibold text-white hover:bg-indigo-700\"><Plus className=\"h-4 w-4\" /> Create Goal</button>\n          </div>\n        </section>\n        <GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />"
          if personal not in s: raise SystemExit('personal marker not found')
          s = s.replace(personal, replacement, 1)
          forecast = "    {forecastVisible && <section"
          modal = "    {createGoalOpen && <div className=\"fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/40 p-0 sm:p-4\"><div className=\"w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl bg-white p-5 shadow-xl max-h-[90vh] overflow-y-auto\"><div className=\"flex items-center justify-between gap-3\"><h3 className=\"text-lg font-bold text-slate-900\">Create personal goal</h3><button type=\"button\" onClick={() => setCreateGoalOpen(false)} className=\"rounded-lg p-2 text-slate-400 hover:bg-slate-100\" aria-label=\"Close\"><X className=\"h-5 w-5\" /></button></div><form onSubmit={saveCreatedGoal} className=\"mt-5 space-y-4\"><label className=\"block\"><span className=\"text-xs font-semibold text-slate-600\">Goal name</span><input required value={createGoalDraft.name} onChange={e => setCreateGoalDraft(c => ({ ...c, name: e.target.value }))} placeholder=\"e.g. Emergency fund\" className=\"mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-500\" /></label><div className=\"grid grid-cols-2 gap-3\"><label className=\"block\"><span className=\"text-xs font-semibold text-slate-600\">Target amount</span><input required type=\"number\" min=\"1\" value={createGoalDraft.targetAmount} onChange={e => setCreateGoalDraft(c => ({ ...c, targetAmount: e.target.value }))} className=\"mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm\" /></label><label className=\"block\"><span className=\"text-xs font-semibold text-slate-600\">Current amount</span><input type=\"number\" min=\"0\" value={createGoalDraft.currentAmount} onChange={e => setCreateGoalDraft(c => ({ ...c, currentAmount: e.target.value }))} className=\"mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm\" /></label></div><div className=\"grid grid-cols-2 gap-3\"><label className=\"block\"><span className=\"text-xs font-semibold text-slate-600\">Target date</span><input required type=\"date\" value={createGoalDraft.targetDate} onChange={e => setCreateGoalDraft(c => ({ ...c, targetDate: e.target.value }))} className=\"mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm\" /></label><label className=\"block\"><span className=\"text-xs font-semibold text-slate-600\">Monthly contribution</span><input type=\"number\" min=\"0\" value={createGoalDraft.monthlyContribution} onChange={e => setCreateGoalDraft(c => ({ ...c, monthlyContribution: e.target.value }))} className=\"mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm\" /></label></div><div><span className=\"text-xs font-semibold text-slate-600\">Goal type</span><div className=\"mt-1 grid grid-cols-2 gap-2\"><button type=\"button\" onClick={() => setCreateGoalDraft(c => ({ ...c, type: 'savings', expectedAnnualReturn: '0' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold ${createGoalDraft.type === 'savings' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Savings goal</button><button type=\"button\" onClick={() => setCreateGoalDraft(c => ({ ...c, type: 'investment', expectedAnnualReturn: c.expectedAnnualReturn === '0' ? '8' : c.expectedAnnualReturn || '8' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold ${createGoalDraft.type === 'investment' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Investment goal</button></div></div>{createGoalDraft.type === 'investment' && <label className=\"block rounded-xl border border-violet-100 bg-violet-50/60 p-3\"><span className=\"text-xs font-semibold text-slate-600\">Expected annual return (%)</span><input type=\"number\" min=\"0\" step=\"0.1\" value={createGoalDraft.expectedAnnualReturn} onChange={e => setCreateGoalDraft(c => ({ ...c, expectedAnnualReturn: e.target.value }))} className=\"mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm\" /><p className=\"mt-1 text-[11px] text-slate-500\">Planning assumption used for investment goal projection.</p></label>}<div className=\"flex justify-end gap-2\"><button type=\"button\" onClick={() => setCreateGoalOpen(false)} className=\"rounded-xl px-4 py-2 text-sm font-semibold text-slate-600\">Cancel</button><button type=\"submit\" className=\"rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white\">Save goal</button></div></form></div></div>}\n"
          if forecast not in s: raise SystemExit('forecast marker not found')
          s = s.replace(forecast, modal + forecast, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManager.tsx
          git commit -m "Add personal goal creation section"
          git rm .github/workflows/add-create-goal.yml
          git commit -m "Remove temporary create goal workflow"
          git push
