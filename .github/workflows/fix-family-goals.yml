name: Fix family goals

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch goal logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()

          s = s.replace("import { collection, deleteDoc, doc, onSnapshot, setDoc } from 'firebase/firestore';", "import { deleteDoc, doc, onSnapshot, setDoc } from 'firebase/firestore';")

          old = '''  const saveGoal = async (event: React.FormEvent) => { event.preventDefault(); const name = goalDraft.name.trim(); const targetAmount = Number(goalDraft.targetAmount); const currentAmount = Number(goalDraft.currentAmount || 0); const monthlyContribution = Number(goalDraft.monthlyContribution || 0); if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !goalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return; const selectedFamily = availableFamilies.find(f => f.id === goalDraft.familyId); const previous = editingGoalId ? goals.find(existing => existing.id === editingGoalId) : undefined; const goal: FinancialGoal = { id: editingGoalId || makeId('goal', name), name, targetAmount, currentAmount, targetDate: goalDraft.targetDate, monthlyContribution, type: goalDraft.type, scope: goalDraft.scope, familyId: goalDraft.scope === 'family' ? goalDraft.familyId || undefined : undefined, familyName: goalDraft.scope === 'family' ? selectedFamily?.name || goalDraft.familyName || undefined : undefined }; const nextGoals = editingGoalId ? goals.map(existing => existing.id === editingGoalId ? goal : existing) : [...goals, goal]; await saveConfig({ ...config, goals: nextGoals }); await syncFamilyGoal(goal, previous?.familyId); closeGoalEditor(); };'''
          new = '''  const saveGoal = async (event: React.FormEvent) => {
            event.preventDefault();
            const name = goalDraft.name.trim();
            const targetAmount = Number(goalDraft.targetAmount);
            const currentAmount = Number(goalDraft.currentAmount || 0);
            const monthlyContribution = Number(goalDraft.monthlyContribution || 0);
            if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !goalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return;
            const selectedFamily = availableFamilies.find(f => f.id === goalDraft.familyId);
            if (goalDraft.scope === 'family' && !selectedFamily) return;
            const previous = editingGoalId ? goals.find(existing => existing.id === editingGoalId) : undefined;
            const goal: FinancialGoal = {
              id: editingGoalId || makeId('goal', name),
              name,
              targetAmount,
              currentAmount,
              targetDate: goalDraft.targetDate,
              monthlyContribution,
              type: goalDraft.type,
              scope: goalDraft.scope,
              familyId: goalDraft.scope === 'family' ? selectedFamily!.id : undefined,
              familyName: goalDraft.scope === 'family' ? selectedFamily!.name : undefined
            };
            const nextGoals = editingGoalId ? goals.map(existing => existing.id === editingGoalId ? goal : existing) : [...goals, goal];

            // Save the personal goal first. A family-sync failure must not make the
            // goal editor appear stuck after the personal goal has already been saved.
            await saveConfig({ ...config, goals: nextGoals });

            try {
              await syncFamilyGoal(goal, previous?.familyId);
            } catch (error) {
              console.error('AHVIQ family goal sync failed', error);
            } finally {
              closeGoalEditor();
            }
          };'''
          if old not in s:
              raise SystemExit('saveGoal block not found')
          s = s.replace(old, new)

          duplicate = '''<div className="flex flex-wrap gap-1.5 mt-1"><span className="rounded-full bg-indigo-50 px-2 py-0.5 text-[10px] font-semibold text-indigo-600">{goal.type === 'investment' ? 'Investment goal' : 'Savings goal'}</span><span className="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-600">{goal.scope === 'family' ? `Family${goal.familyName ? ` · ${goal.familyName}` : ''}` : 'Personal'}</span></div>'''
          if s.count(duplicate) < 2:
              raise SystemExit('duplicate tag block not found twice')
          s = s.replace(duplicate + duplicate, duplicate, 1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git diff --cached --quiet || git commit -m "fix: save family goals reliably and remove duplicate tags"
          git push
