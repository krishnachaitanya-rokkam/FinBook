name: Goal Metadata Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, 'Add goal metadata migration workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update goal metadata UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          s = s.replace("import React, { useMemo, useState } from 'react';", "import React, { useEffect, useMemo, useState } from 'react';")
          s = s.replace("import { FinancialGoal, NetWorthItem, PortfolioConfig, PortfolioField } from '../services/portfolioService';", "import { collection, doc, onSnapshot } from 'firebase/firestore';\nimport { firebaseAuth, firestore } from '../services/firebase';\nimport { FinancialGoal, NetWorthItem, PortfolioConfig, PortfolioField } from '../services/portfolioService';")
          s = s.replace("const emptyGoalDraft = { name: '', targetAmount: '', currentAmount: '', targetDate: '', monthlyContribution: '' };", "const emptyGoalDraft = { name: '', targetAmount: '', currentAmount: '', targetDate: '', monthlyContribution: '', type: 'savings' as 'savings' | 'investment', scope: 'personal' as 'personal' | 'family', familyId: '', familyName: '' };")
          s = s.replace("const [forecastPeriod, setForecastPeriod] = useState<1 | 3 | 5>(5);", "const [availableFamilies, setAvailableFamilies] = useState<{ id: string; name: string }[]>([]);\n  const [forecastPeriod, setForecastPeriod] = useState<1 | 3 | 5>(5);")
          anchor = "  const fields = config.fields || []; const netWorthItems = config.netWorthItems || []; const goals = config.goals || [];"
          inject = anchor + "\n  useEffect(() => {\n    const uid = firebaseAuth.currentUser?.uid;\n    if (!uid) return;\n    return onSnapshot(doc(firestore, 'users', uid, 'family', 'link'), linkSnap => {\n      const familyId = String(linkSnap.data()?.familyId || '');\n      if (!familyId) { setAvailableFamilies([]); return; }\n      return onSnapshot(doc(firestore, 'families', familyId), familySnap => {\n        const data = familySnap.data();\n        setAvailableFamilies(data?.name ? [{ id: familyId, name: String(data.name) }] : []);\n      });\n    });\n  }, []);"
          s = s.replace(anchor, inject)
          old = "const openEditGoal = (goal: FinancialGoal) => { setEditingGoalId(goal.id); setGoalDraft({ name: goal.name, targetAmount: String(goal.targetAmount), currentAmount: String(goal.currentAmount), targetDate: goal.targetDate, monthlyContribution: String(goal.monthlyContribution) }); setIsGoalOpen(true); };"
          new = "const openEditGoal = (goal: FinancialGoal) => { setEditingGoalId(goal.id); setGoalDraft({ name: goal.name, targetAmount: String(goal.targetAmount), currentAmount: String(goal.currentAmount), targetDate: goal.targetDate, monthlyContribution: String(goal.monthlyContribution), type: goal.type || 'savings', scope: goal.scope || 'personal', familyId: goal.familyId || '', familyName: goal.familyName || '' }); setIsGoalOpen(true); };"
          s = s.replace(old, new)
          old = "const saveGoal = async (event: React.FormEvent) => { event.preventDefault(); const name = goalDraft.name.trim(); const targetAmount = Number(goalDraft.targetAmount); const currentAmount = Number(goalDraft.currentAmount || 0); const monthlyContribution = Number(goalDraft.monthlyContribution || 0); if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !goalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return; const goal: FinancialGoal = { id: editingGoalId || makeId('goal', name), name, targetAmount, currentAmount, targetDate: goalDraft.targetDate, monthlyContribution };"
          new = "const saveGoal = async (event: React.FormEvent) => { event.preventDefault(); const name = goalDraft.name.trim(); const targetAmount = Number(goalDraft.targetAmount); const currentAmount = Number(goalDraft.currentAmount || 0); const monthlyContribution = Number(goalDraft.monthlyContribution || 0); if (!name || !Number.isFinite(targetAmount) || targetAmount <= 0 || !Number.isFinite(currentAmount) || currentAmount < 0 || !goalDraft.targetDate || !Number.isFinite(monthlyContribution) || monthlyContribution < 0) return; const selectedFamily = availableFamilies.find(f => f.id === goalDraft.familyId); const goal: FinancialGoal = { id: editingGoalId || makeId('goal', name), name, targetAmount, currentAmount, targetDate: goalDraft.targetDate, monthlyContribution, type: goalDraft.type, scope: goalDraft.scope, familyId: goalDraft.scope === 'family' ? goalDraft.familyId || undefined : undefined, familyName: goalDraft.scope === 'family' ? selectedFamily?.name || goalDraft.familyName || undefined : undefined };"
          s = s.replace(old, new)
          old = "{goals.map(goal => { const progress = Math.min(100, Math.max(0, (goal.currentAmount / goal.targetAmount) * 100));"
          new = "{goals.map(goal => { const progress = Math.min(100, Math.max(0, (goal.currentAmount / goal.targetAmount) * 100));"
          s = s.replace(old, new)
          old = "<p className=\"text-xs text-slate-400\">Target {goal.targetDate ? new Date(`${goal.targetDate}T00:00:00`).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'}</p>"
          new = "<div className=\"flex flex-wrap gap-1.5 mt-1\"><span className=\"rounded-full bg-indigo-50 px-2 py-0.5 text-[10px] font-semibold text-indigo-600\">{goal.type === 'investment' ? 'Investment goal' : 'Savings goal'}</span><span className=\"rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-600\">{goal.scope === 'family' ? `Family${goal.familyName ? ` · ${goal.familyName}` : ''}` : 'Personal'}</span></div><p className=\"text-xs text-slate-400 mt-1\">Target {goal.targetDate ? new Date(`${goal.targetDate}T00:00:00`).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'}</p>"
          s = s.replace(old, new)
          old = "<Input label=\"Monthly contribution\" type=\"number\" min=\"0\" value={goalDraft.monthlyContribution} onChange={value => setGoalDraft(current => ({ ...current, monthlyContribution: value }))} placeholder=\"0\"/>"
          new = "<Input label=\"Monthly contribution\" type=\"number\" min=\"0\" value={goalDraft.monthlyContribution} onChange={value => setGoalDraft(current => ({ ...current, monthlyContribution: value }))} placeholder=\"0\"/><div><span className=\"text-xs font-semibold text-slate-600\">Goal type</span><div className=\"mt-1 grid grid-cols-2 gap-2\"><button type=\"button\" onClick={() => setGoalDraft(current => ({ ...current, type: 'savings' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold ${goalDraft.type === 'savings' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Savings goal</button><button type=\"button\" onClick={() => setGoalDraft(current => ({ ...current, type: 'investment' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold ${goalDraft.type === 'investment' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Investment goal</button></div><p className=\"mt-1 text-[11px] text-slate-400\">Choose whether this target is for saving money or building an investment corpus.</p></div><div><span className=\"text-xs font-semibold text-slate-600\">Goal ownership</span><div className=\"mt-1 grid grid-cols-2 gap-2\"><button type=\"button\" onClick={() => setGoalDraft(current => ({ ...current, scope: 'personal', familyId: '', familyName: '' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold ${goalDraft.scope === 'personal' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>Personal</button><button type=\"button\" disabled={availableFamilies.length === 0} onClick={() => setGoalDraft(current => ({ ...current, scope: 'family', familyId: current.familyId || availableFamilies[0]?.id || '', familyName: current.familyName || availableFamilies[0]?.name || '' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-40 ${goalDraft.scope === 'family' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>Family</button></div>{availableFamilies.length > 0 && goalDraft.scope === 'family' && <select value={goalDraft.familyId} onChange={e => { const family = availableFamilies.find(f => f.id === e.target.value); setGoalDraft(current => ({ ...current, familyId: e.target.value, familyName: family?.name || '' })); }} className=\"mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm\">{availableFamilies.map(family => <option key={family.id} value={family.id}>{family.name}</option>)}</select>}{availableFamilies.length === 0 && <p className=\"mt-1 text-[11px] text-slate-400\">Create or join a family to tag this goal as a family goal.</p>}</div>"
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add goal type and personal or family tagging"
          git push
