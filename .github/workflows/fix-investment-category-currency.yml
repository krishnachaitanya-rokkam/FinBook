name: Fix investment category count

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix category count formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/PortfolioManagerCore.tsx')
          text = path.read_text()
          old_call = '<StatCard title="Investment categories" value={fields.length} note="Tracked investment buckets"/>'
          new_call = '<StatCard title="Investment categories" value={fields.length} note="Tracked investment buckets" format="number"/>'
          old_stat = 'function StatCard({ title, value, note }: { title: string; value: number; note: string }) { return <div className="min-w-0 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><p className="text-xs font-medium text-slate-500 break-words">{title}</p><p className="mt-1 max-w-full text-2xl font-bold text-slate-900 tabular-nums break-words">{formatCurrency(value)}</p><p className="mt-1 text-xs text-slate-400 break-words">{note}</p></div>; }'
          new_stat = 'function StatCard({ title, value, note, format = \'currency\' }: { title: string; value: number; note: string; format?: \'currency\' | \'number\' }) { return <div className="min-w-0 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><p className="text-xs font-medium text-slate-500 break-words">{title}</p><p className="mt-1 max-w-full text-2xl font-bold text-slate-900 tabular-nums break-words">{format === \'number\' ? value.toLocaleString(\'en-IN\') : formatCurrency(value)}</p><p className="mt-1 text-xs text-slate-400 break-words">{note}</p></div>; }'
          if old_call not in text:
              raise SystemExit('Expected Investment categories StatCard call not found')
          if old_stat not in text:
              raise SystemExit('Expected StatCard definition not found')
          text = text.replace(old_call, new_call, 1).replace(old_stat, new_stat, 1)
          path.write_text(text)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx .github/workflows/fix-investment-category-currency.yml
          git rm .github/workflows/fix-investment-category-currency.yml
          git commit -m "Fix investment category count currency formatting"
          git push

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
