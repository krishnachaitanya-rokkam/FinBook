name: Deploy FinBook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply family goal sync fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          start = s.index('  const syncFamilyGoal = async')
          end = s.index('  useEffect', start)
          block = '''  const syncFamilyGoal = async (goal: FinancialGoal, previousFamilyId?: string) => {
            const oldFamilyId = previousFamilyId || '';
            if (oldFamilyId && (goal.scope !== 'family' || goal.familyId !== oldFamilyId)) {
              await deleteDoc(doc(firestore, 'families', oldFamilyId, 'goals', goal.id));
            }
            if (goal.scope === 'family' && goal.familyId) {
              // Use the same shared-goal schema as FamilyGoals.tsx.
              await setDoc(doc(firestore, 'families', goal.familyId, 'goals', goal.id), {
                name: goal.name,
                targetAmount: goal.targetAmount,
                targetDate: goal.targetDate,
                monthlyContribution: goal.monthlyContribution,
                createdBy: firebaseAuth.currentUser?.uid || '',
                createdAt: Date.now(),
                currentAmount: goal.currentAmount,
                contributions: {},
                contributorNames: {},
                updatedAt: Date.now()
              }, { merge: true });
            }
          };
'''
          p.write_text(s[:start] + block + s[end:])
          PY

      - name: Commit family goal fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: align family goal sync with shared schema"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
