name: Make live investment values explicit

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch investment source of truth UI
        shell: python
        run: |
          from pathlib import Path

          service = Path('src/services/portfolioService.ts')
          text = service.read_text()
          old = """    const matching = holdings.filter(item => item.assetType === assetType);\n    if (!matching.length) return field;\n    return {\n      ...field,\n      amount: matching.reduce((sum, item) => sum + (Number(item.currentValue) || 0), 0),\n    };"""
          new = """    const matching = holdings.filter(item => item.assetType === assetType);\n    return {\n      ...field,\n      amount: matching.reduce((sum, item) => sum + (Number(item.currentValue) || 0), 0),\n    };"""
          if old not in text:
              raise SystemExit('Service helper pattern not found')
          service.write_text(text.replace(old, new, 1))

          core = Path('src/components/PortfolioManagerCore.tsx')
          text = core.read_text()
          old = """<p className=\"text-xs text-slate-500 mt-0.5\">Current values across your investment buckets.</p>"""
          new = """<p className=\"text-xs text-slate-500 mt-0.5\">Mutual Funds and Stocks are calculated automatically from your live holdings.</p>"""
          if old in text:
              text = text.replace(old, new, 1)
          old = """{(field.id === 'mutual-funds' || field.id === 'stocks') && holdings.some(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')) && <span className=\"shrink-0 rounded-full bg-emerald-50 px-1.5 py-0.5 text-[9px] font-bold text-emerald-700\">LIVE</span>}"""
          new = """{(field.id === 'mutual-funds' || field.id === 'stocks') && <span className=\"shrink-0 rounded-full bg-emerald-50 px-1.5 py-0.5 text-[9px] font-bold text-emerald-700\">{holdings.some(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')) ? 'LIVE' : 'LINK HOLDINGS'}</span>}"""
          if old in text:
              text = text.replace(old, new, 1)
          old = """<p className=\"mt-5 text-2xl font-bold text-slate-900 tabular-nums\">{formatCurrency(field.amount)}</p>"""
          new = """<p className=\"mt-5 text-2xl font-bold text-slate-900 tabular-nums\">{formatCurrency(field.amount)}</p>{(field.id === 'mutual-funds' || field.id === 'stocks') && <p className=\"mt-1 text-[11px] text-slate-400\">{holdings.filter(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')).length > 0 ? `${holdings.filter(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')).length} holding${holdings.filter(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')).length === 1 ? '' : 's'} · calculated from holdings` : 'No linked holdings yet'}</p>}"""
          if old not in text:
              raise SystemExit('Investment card amount pattern not found')
          core.write_text(text.replace(old, new, 1))

          Path('src/deploymentVersion.ts').write_text("export const AHVIQ_DEPLOYMENT_VERSION = 'live-investments-explicit-20260910';\n")

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/portfolioService.ts src/components/PortfolioManagerCore.tsx src/deploymentVersion.ts .github/workflows/make-live-investments-explicit.yml
          git commit -m "Make live investment values explicit"
          git rm .github/workflows/make-live-investments-explicit.yml
          git commit -m "Remove temporary live investment workflow"
          git push
