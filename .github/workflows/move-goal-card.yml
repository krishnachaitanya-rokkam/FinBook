name: Move goal cards under Goal Planning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move goal detail cards
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/GoalIntelligence.tsx')
          text = path.read_text()
          text = text.replace(
              "type Props = { goals: Goal[] };",
              "type Props = { goals: Goal[]; showGoalCards?: boolean };"
          )
          text = text.replace(
              "export const GoalIntelligence: React.FC<Props> = ({ goals }) => {",
              "export const GoalIntelligence: React.FC<Props> = ({ goals, showGoalCards = true }) => {"
          )
          start = text.find('        <div className="space-y-3">\\n          {visible.map(p =>')
          if start == -1:
              raise SystemExit('Goal card block start not found')
          marker = '\\n        </div>\\n\\n        <div'
          end = text.find(marker, start)
          if end == -1:
              raise SystemExit('Goal card block end not found')
          block = text[start:end + len('\\n        </div>')]
          wrapped = '        {showGoalCards && (\\n' + block + '\\n        )}'
          text = text[:start] + wrapped + text[end + len('\\n        </div>'):]
          path.write_text(text)

          core = Path('src/components/PortfolioManager.tsx')
          c = core.read_text()
          c = c.replace(
              "import { GoalIntelligence } from './GoalIntelligence';",
              "import { GoalIntelligence } from './GoalIntelligence';\\nimport { GoalPlanningCards } from './GoalPlanningCards';"
          )
          c = c.replace(
              "<GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />\\n      <GoalIntelligence goals={goals.map(goal => ({ ...goal, scope: 'personal' as const }))} />",
              "<GoalPlanner goals={goals} onReturnChange={syncGoalReturn} />\\n      <GoalPlanningCards goals={goals} />\\n      <GoalIntelligence goals={goals.map(goal => ({ ...goal, scope: 'personal' as const }))} showGoalCards={false} />"
          )
          core.write_text(c)
      
      - name: Add GoalPlanningCards component
        shell: bash
        run: |
          cat > src/components/GoalPlanningCards.tsx <<'EOF'
          import React, { useMemo } from 'react';
          import { AlertTriangle, CheckCircle2, Target } from 'lucide-react';
          import { FinancialGoal } from '../services/portfolioService';
          import { formatCurrency } from '../utils/formatters';

          interface Props { goals: FinancialGoal[]; }

          const monthsUntil = (date: string) => {
            const target = new Date(`${date}T23:59:59`);
            if (Number.isNaN(target.getTime())) return 0;
            return Math.max(0, Math.ceil((target.getTime() - Date.now()) / (1000 * 60 * 60 * 24 * 30.4375)));
          };

          const annualReturn = (goal: FinancialGoal) =>
            goal.type === 'investment' ? Math.min(50, Math.max(0, Number(goal.expectedAnnualReturn ?? 8) || 0)) : 0;

          const requiredMonthly = (goal: FinancialGoal, months: number) => {
            const target = Math.max(0, Number(goal.targetAmount) || 0);
            const current = Math.max(0, Number(goal.currentAmount) || 0);
            if (months <= 0) return Math.max(0, target - current);
            if (target <= current) return 0;
            const r = Math.pow(1 + annualReturn(goal) / 100, 1 / 12) - 1;
            if (r === 0) return Math.ceil((target - current) / months / 100) * 100;
            const growth = Math.pow(1 + r, months);
            const factor = (growth - 1) / r;
            return Math.max(0, Math.ceil((target - current * growth) / factor / 100) * 100);
          };

          const project = (goal: FinancialGoal, months: number) => {
            let value = Math.max(0, Number(goal.currentAmount) || 0);
            const monthly = Math.max(0, Number(goal.monthlyContribution) || 0);
            const r = Math.pow(1 + annualReturn(goal) / 100, 1 / 12) - 1;
            for (let i = 0; i < months; i += 1) value = value * (1 + r) + monthly;
            return value;
          };

          export const GoalPlanningCards: React.FC<Props> = ({ goals }) => {
            const plans = useMemo(() => goals.map(goal => {
              const target = Math.max(0, Number(goal.targetAmount) || 0);
              const current = Math.max(0, Number(goal.currentAmount) || 0);
              const months = monthsUntil(goal.targetDate);
              const required = requiredMonthly(goal, months);
              const projected = project(goal, months);
              const onTrack = current >= target || projected >= target;
              return {
                goal,
                target,
                current,
                months,
                required,
                projected,
                onTrack,
                progress: target ? Math.min(100, Math.round((current / target) * 100)) : 0,
              };
            }), [goals]);

            if (!plans.length) return null;

            return <section className="mt-5 space-y-3">
              {plans.map(p => <div key={p.goal.id} className="rounded-2xl border border-indigo-100 bg-white p-4 sm:p-5 shadow-sm">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <div className="flex flex-wrap items-center gap-2">
                      <Target className="h-5 w-5 text-indigo-500" />
                      <p className="font-bold text-slate-900 truncate">{p.goal.name}</p>
                      <span className={`rounded-full px-2 py-0.5 text-[10px] font-bold ${p.goal.type === 'investment' ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'}`}>{p.goal.type === 'investment' ? 'INVESTMENT' : 'SAVINGS'}</span>
                    </div>
                    <p className="mt-1 text-xs sm:text-sm text-slate-500">{p.months} months remaining · Target {formatCurrency(p.target)} · Return {p.goal.type === 'investment' ? `${annualReturn(p.goal)}%` : '0%'}</p>
                  </div>
                  <span className={`inline-flex items-center gap-1 rounded-full px-2 py-1 text-[10px] font-bold ${p.onTrack ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                    {p.onTrack ? <CheckCircle2 className="h-3.5 w-3.5" /> : <AlertTriangle className="h-3.5 w-3.5" />}
                    {p.onTrack ? 'ON TRACK' : 'NEEDS ATTENTION'}
                  </span>
                </div>
                <div className="mt-3 h-2 overflow-hidden rounded-full bg-slate-100"><div className="h-full rounded-full bg-indigo-500" style={{ width: `${p.progress}%` }} /></div>
                <div className="mt-3 grid grid-cols-2 lg:grid-cols-5 gap-2">
                  <div className="rounded-lg bg-slate-50 p-2.5"><p className="text-[10px] text-slate-400">Current</p><p className="text-sm font-bold tabular-nums">{formatCurrency(p.current)}</p></div>
                  <div className="rounded-lg bg-indigo-50 p-2.5"><p className="text-[10px] text-indigo-500">Required / month</p><p className="text-sm font-bold text-indigo-700 tabular-nums">{formatCurrency(p.required)}</p></div>
                  <div className="rounded-lg bg-violet-50 p-2.5"><p className="text-[10px] text-violet-500">Return</p><p className="text-sm font-bold text-violet-700 tabular-nums">{annualReturn(p.goal)}%</p></div>
                  <div className="rounded-lg bg-slate-50 p-2.5"><p className="text-[10px] text-slate-400">Plan</p><p className="text-sm font-bold tabular-nums">{formatCurrency(p.goal.monthlyContribution)}</p></div>
                  <div className="rounded-lg bg-slate-50 p-2.5"><p className="text-[10px] text-slate-400">Projected</p><p className="text-sm font-bold tabular-nums">{formatCurrency(p.projected)}</p></div>
                </div>
              </div>)}
            </section>;
          };
          EOF

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GoalIntelligence.tsx src/components/PortfolioManager.tsx src/components/GoalPlanningCards.tsx
          git commit -m "Move goal detail cards under Goal Planning"
          git push
