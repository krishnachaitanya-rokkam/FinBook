name: Fix mutual fund holdings linking

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mutual fund field matching
        shell: python
        run: |
          from pathlib import Path

          service = Path('src/services/portfolioService.ts')
          text = service.read_text()
          old = """export function getEffectivePortfolioFields(config: PortfolioConfig): PortfolioField[] {\n  const fields = config.fields || [];\n  const holdings = config.holdings || [];\n  return fields.map(field => {\n    if (field.id !== 'mutual-funds' && field.id !== 'stocks') return field;\n    const assetType = field.id === 'mutual-funds' ? 'mutual-fund' : 'stock';\n    const matching = holdings.filter(item => item.assetType === assetType);\n    return {\n      ...field,\n      amount: matching.reduce((sum, item) => sum + (Number(item.currentValue) || 0), 0),\n    };\n  });\n}\n"""
          new = """export function getHoldingAssetType(field: PortfolioField): 'mutual-fund' | 'stock' | null {\n  const id = String(field.id || '').toLowerCase().replace(/[_\\s]+/g, '-');\n  const label = String(field.label || '').toLowerCase().replace(/[_\\s]+/g, '-');\n  if (id === 'mutual-funds' || id === 'mutual-fund' || id === 'mutualfunds' || label === 'mutual-funds' || label === 'mutual-fund') return 'mutual-fund';\n  if (id === 'stocks' || id === 'stock' || label === 'stocks' || label === 'stock') return 'stock';\n  return null;\n}\n\nexport function getEffectivePortfolioFields(config: PortfolioConfig): PortfolioField[] {\n  const fields = config.fields || [];\n  const holdings = config.holdings || [];\n  return fields.map(field => {\n    const assetType = getHoldingAssetType(field);\n    if (!assetType) return field;\n    const matching = holdings.filter(item => item.assetType === assetType);\n    return {\n      ...field,\n      amount: matching.reduce((sum, item) => sum + (Number(item.currentValue) || 0), 0),\n    };\n  });\n}\n"""
          if old not in text:
              raise SystemExit('portfolio helper pattern not found')
          service.write_text(text.replace(old, new, 1))

          core = Path('src/components/PortfolioManagerCore.tsx')
          text = core.read_text()
          text = text.replace("FinancialGoal, NetWorthItem, PortfolioConfig, PortfolioField, getEffectivePortfolioFields", "FinancialGoal, NetWorthItem, PortfolioConfig, PortfolioField, getEffectivePortfolioFields, getHoldingAssetType", 1)
          old = """{(field.id === 'mutual-funds' || field.id === 'stocks') && <span className=\"shrink-0 rounded-full bg-emerald-50 px-1.5 py-0.5 text-[9px] font-bold text-emerald-700\">{holdings.some(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')) ? 'LIVE' : 'LINK HOLDINGS'}</span>}"""
          new = """{getHoldingAssetType(field) && <span className=\"shrink-0 rounded-full bg-emerald-50 px-1.5 py-0.5 text-[9px] font-bold text-emerald-700\">{holdings.some(item => item.assetType === getHoldingAssetType(field)) ? 'LIVE' : 'LINK HOLDINGS'}</span>}"""
          if old not in text:
              raise SystemExit('portfolio badge pattern not found')
          text = text.replace(old, new, 1)
          old = """{(field.id === 'mutual-funds' || field.id === 'stocks') && <p className=\"mt-1 text-[11px] text-slate-400\">{holdings.filter(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')).length > 0 ? `${holdings.filter(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')).length} holding${holdings.filter(item => item.assetType === (field.id === 'mutual-funds' ? 'mutual-fund' : 'stock')).length === 1 ? '' : 's'} · calculated from holdings` : 'No linked holdings yet'}</p>}"""
          new = """{getHoldingAssetType(field) && <p className=\"mt-1 text-[11px] text-slate-400\">{holdings.filter(item => item.assetType === getHoldingAssetType(field)).length > 0 ? `${holdings.filter(item => item.assetType === getHoldingAssetType(field)).length} holding${holdings.filter(item => item.assetType === getHoldingAssetType(field)).length === 1 ? '' : 's'} · calculated from holdings` : 'No linked holdings yet'}</p>}"""
          if old not in text:
              raise SystemExit('portfolio detail pattern not found')
          text = text.replace(old, new, 1)
          core.write_text(text)

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/portfolioService.ts src/components/PortfolioManagerCore.tsx .github/workflows/fix-mf-linking.yml
          git commit -m "Fix mutual fund holdings linking"
          git rm .github/workflows/fix-mf-linking.yml
          git commit -m "Remove temporary mutual fund linking workflow"
          git push