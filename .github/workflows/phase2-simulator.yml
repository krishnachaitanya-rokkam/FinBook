name: Phase 2 Simulator Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch What-If simulator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/PortfolioManager.tsx')
          text = path.read_text()

          marker = '    {tab === \'forecast\' && <>'
          if 'What-If Simulator' in text:
              raise SystemExit('Phase 2 simulator already present')

          simulator = '''      <div className="rounded-2xl border border-indigo-100 bg-gradient-to-br from-white via-indigo-50/60 to-cyan-50/60 p-4 sm:p-5 shadow-sm">
        <div className="flex flex-col gap-4">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <p className="text-xs font-semibold uppercase tracking-wider text-indigo-600">What-if planning</p>
              <h4 className="mt-1 text-lg font-bold text-slate-900">What-If Simulator</h4>
              <p className="mt-1 text-xs sm:text-sm text-slate-500">See what increasing your monthly investment could do to your projected wealth. Nothing here changes your actual plan.</p>
            </div>
            <span className="shrink-0 rounded-full bg-white px-2.5 py-1 text-[10px] font-bold text-indigo-600 border border-indigo-100">SIMULATION</span>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
            <div className="rounded-xl border border-slate-200 bg-white p-3">
              <p className="text-[11px] text-slate-400">Current monthly investment</p>
              <p className="mt-1 text-lg font-bold text-slate-900 tabular-nums">{formatCurrency(effectiveMonthlyContribution)}</p>
            </div>
            <label className="rounded-xl border border-indigo-200 bg-white p-3">
              <span className="text-[11px] font-semibold text-indigo-600">What-if monthly investment</span>
              <input type="number" min="0" step="1000" value={whatIfMonthlyContribution} onChange={e => setWhatIfMonthlyContribution(Math.max(0, Number(e.target.value) || 0))} className="mt-1 w-full rounded-lg border border-slate-200 px-2.5 py-2 text-sm font-bold tabular-nums outline-none focus:border-indigo-500" />
            </label>
            <div className="rounded-xl border border-slate-200 bg-white p-3">
              <p className="text-[11px] text-slate-400">Additional monthly investment</p>
              <p className={`mt-1 text-lg font-bold tabular-nums ${whatIfMonthlyContribution >= effectiveMonthlyContribution ? 'text-emerald-700' : 'text-rose-600'}`}>{whatIfMonthlyContribution >= effectiveMonthlyContribution ? '+' : '−'}{formatCurrency(Math.abs(whatIfMonthlyContribution - effectiveMonthlyContribution))}</p>
            </div>
          </div>
          <div className="flex flex-wrap gap-2">
            {[10000, 25000, 50000].map(increase => <button key={increase} type="button" onClick={() => setWhatIfMonthlyContribution(effectiveMonthlyContribution + increase)} className="rounded-lg border border-indigo-100 bg-white px-3 py-1.5 text-xs font-semibold text-indigo-700 hover:bg-indigo-50">+{formatCurrency(increase)}</button>)}
            <button type="button" onClick={() => setWhatIfMonthlyContribution(effectiveMonthlyContribution)} className="rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-500 hover:bg-slate-100">Reset</button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="rounded-xl bg-white border border-slate-200 p-3"><p className="text-[11px] text-slate-400">Current projection</p><p className="mt-1 text-base font-bold text-slate-900 tabular-nums">{formatCurrency(forecast.target)}</p><p className="text-[10px] text-slate-400">{forecastPeriod}-year</p></div>
            <div className="rounded-xl bg-indigo-600 p-3"><p className="text-[11px] text-indigo-100">What-if projection</p><p className="mt-1 text-base font-bold text-white tabular-nums">{formatCurrency(whatIfForecast.target)}</p><p className="text-[10px] text-indigo-100">{forecastPeriod}-year</p></div>
            <div className="rounded-xl bg-emerald-50 border border-emerald-100 p-3"><p className="text-[11px] text-emerald-600">Additional projected wealth</p><p className="mt-1 text-base font-bold text-emerald-700 tabular-nums">+{formatCurrency(Math.max(0, whatIfForecast.target - forecast.target))}</p><p className="text-[10px] text-emerald-600">vs current plan</p></div>
          </div>
          <div className="rounded-xl border border-indigo-100 bg-white/80 px-3 py-3">
            <p className="text-xs leading-5 text-slate-600">{whatIfMonthlyContribution === effectiveMonthlyContribution ? 'Set a higher monthly investment above to see how much additional wealth your current assumptions could potentially create.' : `Increasing your monthly investment by ${formatCurrency(Math.abs(whatIfMonthlyContribution - effectiveMonthlyContribution))} could add ${formatCurrency(Math.max(0, whatIfForecast.target - forecast.target))} to your projected net worth over ${forecastPeriod} year${forecastPeriod > 1 ? 's' : ''}.`}</p>
          </div>
        </div>
      </div>
'''

          # Add local simulator state beside existing forecast controls.
          state_marker = "  const [forecastPeriod, setForecastPeriod] = useState<1 | 3 | 5>(5); const [forecastRate, setForecastRate] = useState<8 | 10 | 12>(10); const [monthlyContribution, setMonthlyContribution] = useState<number | null>(null);"
          state_replacement = state_marker + "\n  const [whatIfMonthlyContribution, setWhatIfMonthlyContribution] = useState<number | null>(null);"
          if state_marker not in text:
              raise SystemExit('forecast state marker not found')
          text = text.replace(state_marker, state_replacement, 1)

          calc_marker = "  const forecastMax = Math.max(netWorth, ...forecast.points.map(point => point.value), 1);"
          calc = '''  const whatIfContribution = whatIfMonthlyContribution ?? effectiveMonthlyContribution;
  const whatIfForecast = useMemo(() => {
    const otherNetWorth = netWorth - portfolioTotal;
    const monthlyRate = Math.pow(1 + forecastRate / 100, 1 / 12) - 1;
    const build = (months: number) => {
      let investments = portfolioTotal;
      for (let i = 0; i < months; i += 1) investments = investments * (1 + monthlyRate) + whatIfContribution;
      return otherNetWorth + investments;
    };
    return { target: build(forecastPeriod * 12) };
  }, [netWorth, portfolioTotal, forecastRate, whatIfContribution, forecastPeriod]);
'''
          if calc_marker not in text:
              raise SystemExit('forecast calculation marker not found')
          text = text.replace(calc_marker, calc_marker + '\n' + calc, 1)

          confidence_marker = '      <div className="rounded-2xl border border-emerald-100 bg-emerald-50/60 p-4 flex items-start gap-3">'
          if confidence_marker not in text:
              raise SystemExit('forecast confidence marker not found')
          text = text.replace(confidence_marker, simulator + confidence_marker, 1)

          path.write_text(text)
          PY
      - name: Commit Phase 2 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManager.tsx
          git commit -m "Add Phase 2 what-if wealth simulator"
          git push
      - name: Remove patch workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/phase2-simulator.yml
          git commit -m "Remove temporary Phase 2 patch workflow"
          git push
