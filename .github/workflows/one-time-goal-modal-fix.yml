name: One-time goal modal fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-goal-modal-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace goal modal with stable personal-only modal
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/PortfolioManagerCore.tsx')
          s = p.read_text()
          start = s.index("    {isGoalOpen && <Modal title={editingGoalId ? 'Edit financial goal'")
          end = s.index("\n  </section>;", start)
          replacement = '''    {isGoalOpen && <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/40 p-0 sm:p-4"><div className="w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl bg-white p-5 shadow-xl max-h-[90vh] overflow-y-auto"><div className="flex items-center justify-between gap-3"><h3 className="text-lg font-bold text-slate-900">{editingGoalId ? 'Edit financial goal' : 'New financial goal'}</h3><button type="button" onClick={closeGoalEditor} className="rounded-lg p-2 text-slate-400 hover:bg-slate-100" aria-label="Close"><X className="h-5 w-5" /></button></div><form onSubmit={saveGoal} className="mt-5 space-y-4"><Input label="Goal name" value={goalDraft.name || ''} onChange={value => setGoalDraft(current => ({ ...current, name: value }))} placeholder="e.g. Emergency fund"/><Input label="Target amount" type="number" min="1" value={goalDraft.targetAmount || ''} onChange={value => setGoalDraft(current => ({ ...current, targetAmount: value }))} placeholder="0"/><Input label="Current amount" type="number" min="0" value={goalDraft.currentAmount || ''} onChange={value => setGoalDraft(current => ({ ...current, currentAmount: value }))} placeholder="0"/><Input label="Target date" type="date" value={goalDraft.targetDate || ''} onChange={value => setGoalDraft(current => ({ ...current, targetDate: value }))}/><Input label="Monthly contribution" type="number" min="0" value={goalDraft.monthlyContribution || ''} onChange={value => setGoalDraft(current => ({ ...current, monthlyContribution: value }))} placeholder="0"/><div><span className="text-xs font-semibold text-slate-600">Goal type</span><div className="mt-1 grid grid-cols-2 gap-2"><button type="button" onClick={() => setGoalDraft(current => ({ ...current, type: 'savings' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold ${goalDraft.type === 'savings' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Savings goal</button><button type="button" onClick={() => setGoalDraft(current => ({ ...current, type: 'investment' }))} className={`rounded-xl px-3 py-2 text-sm font-semibold ${goalDraft.type === 'investment' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Investment goal</button></div><p className="mt-1 text-[11px] text-slate-400">Choose whether this target is for saving money or building an investment corpus.</p></div><div className="flex justify-end gap-2"><button type="button" onClick={closeGoalEditor} className="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600">Cancel</button><button type="submit" disabled={saving} className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white disabled:opacity-50">{saving ? 'Saving…' : 'Save goal'}</button></div></form></div></div>}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git commit -m "Fix individual goal modal crash"
          git rm .github/workflows/one-time-goal-modal-fix.yml
          git commit --amend --no-edit
          git push
