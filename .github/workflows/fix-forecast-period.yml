name: Fix forecast period chart

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch forecast chart to selected period
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/PortfolioManagerCore.tsx')
          text = path.read_text()

          text = text.replace("conservativePoints[5].value", "conservativePoints[conservativePoints.length - 1].value")
          text = text.replace("optimisticPoints[5].value", "optimisticPoints[optimisticPoints.length - 1].value")

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortfolioManagerCore.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix forecast chart selected period"
          git push
