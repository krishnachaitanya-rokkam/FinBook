name: Apply investment goal linking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-goal-linking.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch investment goal linking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/InvestmentHoldingsAuto.tsx')
          s = p.read_text()
          replacements = [
            ("const goals = (config.goals || []).filter(g => g.scope === 'personal' && g.type === 'investment');", "const goals = (config.goals || []).filter(g => g.scope === 'personal');"),
            ("const syncGoalProgress = (goals: PortfolioConfig['goals'] = [], previousHoldings: InvestmentHolding[] = [], nextHoldings: InvestmentHolding[] = []) => goals.map(goal => {", "const syncGoalProgress = (goals: PortfolioConfig['goals'] = [], previousHoldings: InvestmentHolding[] = [], nextHoldings: InvestmentHolding[] = [], nextFields: PortfolioField[] = []) => goals.map(goal => {"),
            ("  const linked = nextHoldings.filter(h => h.goalId === goal.id);\n  if (!linked.length) return wasLinked ? { ...goal, currentAmount: 0 } : goal;\n  return { ...goal, currentAmount: linked.reduce((sum, h) => sum + (Number(h.currentValue) || 0), 0) };", "  const linked = nextHoldings.filter(h => h.goalId === goal.id);\n  const linkedFields = nextFields.filter(f => !getHoldingAssetType(f) && f.goalId === goal.id);\n  const linkedAmount = linked.reduce((sum, h) => sum + (Number(h.currentValue) || 0), 0) + linkedFields.reduce((sum, f) => sum + (Number(f.amount) || 0), 0);\n  if (!linked.length && !linkedFields.length) return wasLinked ? { ...goal, currentAmount: 0 } : goal;\n  return { ...goal, currentAmount: linkedAmount };"),
            ("const [categoryDraft, setCategoryDraft] = useState({ label: '', amount: '' });", "const [categoryDraft, setCategoryDraft] = useState({ label: '', amount: '', goalId: '' });"),
            ("const openCategoryCreate = () => { setEditingCategoryId(null); setCategoryDraft({ label: '', amount: '' }); setCategoryOpen(true); };", "const openCategoryCreate = () => { setEditingCategoryId(null); setCategoryDraft({ label: '', amount: '', goalId: '' }); setCategoryOpen(true); };"),
            ("const openCategoryEdit = (f: PortfolioField) => { setEditingCategoryId(f.id); setCategoryDraft({ label: f.label, amount: String(f.amount) }); setCategoryOpen(true); };", "const openCategoryEdit = (f: PortfolioField) => { setEditingCategoryId(f.id); setCategoryDraft({ label: f.label, amount: String(f.amount), goalId: f.goalId || '' }); setCategoryOpen(true); };"),
            ("const closeCategory = () => { setCategoryOpen(false); setEditingCategoryId(null); setCategoryDraft({ label: '', amount: '' }); };", "const closeCategory = () => { setCategoryOpen(false); setEditingCategoryId(null); setCategoryDraft({ label: '', amount: '', goalId: '' }); };"),
            ("? customFields.map(f => f.id === editingCategoryId ? { ...f, label, amount } : f)\n      : [...customFields, { id: idFor('asset', label), label, amount, color: COLORS[customFields.length % COLORS.length] }];\n    setSaving(true); try { await onSave({ ...config, fields: next }); closeCategory(); } finally { setSaving(false); }", "? customFields.map(f => f.id === editingCategoryId ? { ...f, label, amount, goalId: categoryDraft.goalId || undefined } : f)\n      : [...customFields, { id: idFor('asset', label), label, amount, color: COLORS[customFields.length % COLORS.length], goalId: categoryDraft.goalId || undefined }];\n    const nextGoals = syncGoalProgress(config.goals, holdings, holdings, next);\n    setSaving(true); try { await onSave({ ...config, fields: next, goals: nextGoals }); closeCategory(); } finally { setSaving(false); }"),
            ("setSaving(true); try { await onSave({ ...config, fields: customFields.filter(x => x.id !== id) }); } finally { setSaving(false); }", "const nextFields = customFields.filter(x => x.id !== id);\n    const nextGoals = syncGoalProgress(config.goals, holdings, holdings, nextFields);\n    setSaving(true); try { await onSave({ ...config, fields: nextFields, goals: nextGoals }); } finally { setSaving(false); }"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected source pattern not found: ' + old[:100])
              s = s.replace(old, new, 1)
          old_input = '<input required type="number" min="0" step="0.01" value={categoryDraft.amount} onChange={e => setCategoryDraft(d => ({ ...d, amount: e.target.value }))} className="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" placeholder="0" />'
          new_input = old_input + '<label className="mt-3 block text-xs font-semibold text-slate-600">Tag to goal<select value={categoryDraft.goalId} onChange={e => setCategoryDraft(d => ({ ...d, goalId: e.target.value }))} className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm"><option value="">No goal</option>{(config.goals || []).filter(g => g.scope === "personal").map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select><span className="mt-1 block text-[10px] font-normal text-slate-400">This investment value will count toward the selected goal.</span></label>'
          if old_input not in s:
              raise SystemExit('Category amount input not found')
          s = s.replace(old_input, new_input, 1)
          p.write_text(s)
          PY
          npm install
          npm run build

      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InvestmentHoldingsAuto.tsx
          git diff --cached --quiet || git commit -m "Add goal tagging to all investments"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4