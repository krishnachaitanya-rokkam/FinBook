name: Apply investment goal linking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-goal-linking.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch investment goal linking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/InvestmentHoldingsAuto.tsx')
          s = p.read_text()
          replacements = [
            ("const syncGoalProgress = (goals: PortfolioConfig['goals'] = [], previousHoldings: InvestmentHolding[] = [], nextHoldings: InvestmentHolding[] = [], nextFields: PortfolioField[] = []) => goals.map(goal => {", "const syncGoalProgress = (goals: PortfolioConfig['goals'] = [], previousHoldings: InvestmentHolding[] = [], nextHoldings: InvestmentHolding[] = [], previousFields: PortfolioField[] = [], nextFields: PortfolioField[] = []) => goals.map(goal => {"),
            ("const wasLinked = previousHoldings.some(h => h.goalId === goal.id);", "const wasLinked = previousHoldings.some(h => h.goalId === goal.id) || previousFields.some(f => !getHoldingAssetType(f) && f.goalId === goal.id);"),
            ("const nextGoals = syncGoalProgress(config.goals, holdings, nextHoldings);", "const nextGoals = syncGoalProgress(config.goals, holdings, nextHoldings, customFields, customFields);"),
            ("const nextGoals = syncGoalProgress(config.goals, holdings, holdings, next);", "const nextGoals = syncGoalProgress(config.goals, holdings, holdings, customFields, next);"),
            ("const nextGoals = syncGoalProgress(config.goals, holdings, holdings, nextFields);", "const nextGoals = syncGoalProgress(config.goals, holdings, holdings, customFields, nextFields);"),
            ("<label className=\"mt-3 block text-xs font-semibold text-slate-600\">Tag to goal<select value={categoryDraft.goalId}", "<div className=\"mt-3\"><label className=\"block text-xs font-semibold text-slate-600\">Tag to goal<select value={categoryDraft.goalId}"),
            ("This investment value will count toward the selected goal.</span></label></label><div className=\"mt-6", "This investment value will count toward the selected goal.</span></label></div><div className=\"mt-6"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected source pattern not found: ' + old[:120])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          npm install
          npm run build

      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InvestmentHoldingsAuto.tsx
          git diff --cached --quiet || git commit -m "Complete investment goal progress linking"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4